<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UptimeGuard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
  </head>
  <body>

    <nav>
      <div class="logo">UptimeGuard</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="signup.html" class="btn-primary">Get Started Free</a>
      </div>
    </nav>

    <section class="auth-section">
      <div class="auth-card">

        <div class="auth-header">
          <h2>Welcome back</h2>
          <p>Login to your UptimeGuard account</p>
        </div>

        <div class="auth-form">

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="danish@gmail.com">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password">
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>

          <button class="btn-submit" onclick="handleLogin()">Login</button>

          <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up free</a></p>

        </div>
      </div>
    </section>

    <script>
      async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (email === '' || password === '') {
          alert('Please fill in all fields!');
          return;
        }

        if (!email.includes('@')) {
          alert('Please enter a valid email address!');
          return;
        }

        const btn = document.querySelector('.btn-submit');
        btn.textContent = 'Logging in...';
        btn.disabled = true;

        try {
          const response = await fetch('http://127.0.0.1:5000/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({
              email: email,
              password: password
            })
          });

          const data = await response.json();

          if (response.ok) {
            localStorage.setItem('user_name', data.user.name);
            localStorage.setItem('user_id', data.user.id);
            window.location.href = 'dashboard.html';
          } else {
            alert('Error: ' + data.error);
            btn.textContent = 'Login';
            btn.disabled = false;
          }

        } catch (error) {
          alert('Could not connect to server. Make sure the backend is running!');
          btn.textContent = 'Login';
          btn.disabled = false;
        }
      }
    </script>

  </body>
</html>
